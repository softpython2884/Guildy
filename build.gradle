plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'guildy'
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	mavenCentral()
}

loom {
	runs {
		server {
			// Dev server is started headless; run dir is ./run
			programArgs '--nogui'
		}
	}
}

fabricApi {
	// Server GameTests in src/gametest (run automatically by `build`, or with `runGameTest`).
	configureTests {
		createSourceSet = true
		modId = "guildy-test"
		enableGameTests = true
		enableClientGameTests = false
		// Dev/test environment only: required to start the headless test server (Minecraft EULA).
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Embedded libraries (jar-in-jar): server admins only need Fabric API.
	implementation "eu.pb4:sgui:${project.sgui_version}"
	include "eu.pb4:sgui:${project.sgui_version}"
	implementation "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
