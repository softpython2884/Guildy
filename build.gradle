plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'guildy'
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	mavenCentral()
}

loom {
	runs {
		server {
			// Dev server is started headless; run dir is ./run
			programArgs '--nogui'
		}
	}
}

fabricApi {
	// Server GameTests in src/gametest (run automatically by `build`, or with `runGameTest`).
	configureTests {
		createSourceSet = true
		modId = "guildy-test"
		enableGameTests = true
		enableClientGameTests = false
		// Dev/test environment only: required to start the headless test server (Minecraft EULA).
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Embedded libraries (jar-in-jar): server admins only need Fabric API.
	implementation "eu.pb4:sgui:${project.sgui_version}"
	include "eu.pb4:sgui:${project.sgui_version}"
	implementation "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

	// Optional: when the Polymer resource pack mod is installed, the unique weapon models are added to its pack
	// (dev.guildy.unique.PolymerBridge is only loaded when it is present). Never embedded.
	compileOnly "eu.pb4:polymer-resource-pack:0.18.4+26.3"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Optional resource pack (unique weapon models and textures) for servers without Polymer:
// build/libs/guildy-resourcepack-<version>.zip, to host and declare with resource-pack= in server.properties.
def resourcePackZip = tasks.register('resourcePackZip', Zip) {
	group = 'build'
	description = 'Zips the optional Guildy resource pack (unique weapon models).'
	archiveFileName = "guildy-resourcepack-${project.version}.zip"
	destinationDirectory = layout.buildDirectory.dir('libs')
	from('tools/resourcepack')
	from('src/main/resources/assets') {
		into 'assets'
	}
	// Pack check: every asset of the mod (item models and textures, equipment assets of the unique armors) is in the zip.
	def assetsDir = file('src/main/resources/assets')
	doLast {
		def entries = new HashSet<String>()
		new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip -> zip.entries().each { entries.add(it.name) } }
		def missing = []
		assetsDir.eachFileRecurse(groovy.io.FileType.FILES) { asset ->
			def path = 'assets/' + assetsDir.toPath().relativize(asset.toPath()).toString().replace(File.separator, '/')
			if (!entries.contains(path)) {
				missing.add(path)
			}
		}
		if (!entries.any { it.startsWith('assets/guildy/equipment/') && it.endsWith('.json') }
				|| !entries.any { it.startsWith('assets/guildy/textures/entity/equipment/') && it.endsWith('.png') }) {
			missing.add('assets/guildy/equipment (worn armor looks)')
		}
		if (!missing.isEmpty()) {
			throw new GradleException('Resource pack zip incomplete: ' + missing)
		}
	}
}

tasks.named('assemble') {
	dependsOn resourcePackZip
}
